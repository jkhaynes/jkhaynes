name: Update profile

# Refreshes "Recently shipped" in README.md and the loot spec badge
# (badges/loot-specs.json). See scripts/update-profile.mjs.

on:
  schedule:
    - cron: "17 11 * * *" # daily, off the top of the hour when GitHub is busiest
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04 # pinned; ubuntu-latest moves to 26 on Oct 19
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test the script
        run: node --test scripts/update-profile.test.mjs
      - name: Refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs
      # Commit only when something changed, so a quiet day adds no history.
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md badges/loot-specs.json
          git commit -m "Update recently shipped and spec badge"
          git push
